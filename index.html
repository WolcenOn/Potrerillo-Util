<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercom Pro - Ingeniería de Campo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .regleta-box { @apply bg-white border-2 border-slate-200 rounded-3xl p-4 shadow-lg mb-8; }
        .borne-card { @apply bg-slate-50 border border-slate-200 rounded-xl p-2 flex flex-col items-center shadow-sm; }
        .pill { @apply w-12 h-12 rounded-full flex items-center justify-center font-black text-xl mb-1 border-4 shadow-md bg-white transition-all; }
        select { @apply text-[10px] font-black border-2 rounded p-1 w-full bg-white outline-none border-slate-300 text-slate-900 mb-1; }
        .label-func { @apply text-[8px] font-black uppercase text-slate-500 mb-1; }
        
        /* BOTONES ASISTENTE - MÁXIMO CONTRASTE */
        .btn-yes-pro { @apply flex-1 bg-white text-emerald-600 font-black py-6 rounded-2xl shadow-[0_8px_0_#10b981] border-4 border-emerald-500 uppercase text-xl active:translate-y-1 active:shadow-none transition-all; }
        .btn-no-pro { @apply flex-1 bg-white text-rose-600 font-black py-6 rounded-2xl shadow-[0_8px_0_#f43f5e] border-4 border-rose-500 uppercase text-xl active:translate-y-1 active:shadow-none transition-all; }
        .btn-start-pro { @apply w-full bg-white text-blue-700 font-black py-5 rounded-2xl shadow-[0_8px_0_#2563eb] border-4 border-blue-600 uppercase tracking-widest text-sm active:translate-y-1 active:shadow-none transition-all; }
        
        .instruccion-box { @apply bg-blue-50 p-5 rounded-2xl border-l-8 border-blue-500 my-4 text-left shadow-inner text-slate-800 leading-snug; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20 font-sans">

    <div class="max-w-4xl mx-auto p-4">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">Intercom<span class="text-blue-600">Pro</span></h1>
            <div class="mt-4">
                <input type="text" placeholder="📍 UBICACIÓN / REFERENCIA DEL TRABAJO" class="w-full p-4 rounded-2xl border-2 border-slate-300 font-bold text-sm shadow-sm bg-white outline-none focus:border-blue-500 uppercase">
            </div>
        </header>

        <div class="flex flex-col gap-6 mb-10">
            <div class="bg-white p-4 rounded-3xl border-l-8 border-red-500 shadow-md">
                <label class="block text-[11px] font-black text-red-600 uppercase mb-2 italic tracking-widest">1. EQUIPO A SUSTITUIR (ORIGEN)</label>
                <select id="selectO" onchange="updateUI()" class="w-full text-sm font-bold p-3 border-red-100"></select>
            </div>
            
            <div class="bg-white p-4 rounded-3xl border-l-8 border-green-500 shadow-md">
                <label class="block text-[11px] font-black text-green-700 uppercase mb-2 italic tracking-widest">2. NUEVO EQUIPO A INSTALAR (DESTINO)</label>
                <select id="selectD" onchange="updateUI()" class="w-full text-sm font-bold p-3 border-green-100 text-blue-700"></select>
            </div>
        </div>

        <div class="regleta-box border-red-200">
            <h2 class="text-[11px] font-black text-red-600 uppercase italic mb-4 border-b pb-2">Mapeo Físico Origen (Cables Antiguos)</h2>
            <div id="gridO" class="grid grid-cols-5 gap-3"></div>
        </div>

        <div class="regleta-box border-green-300">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-[11px] font-black text-green-700 uppercase italic">Esquema de Conexión Final (Destino)</h2>
                <button onclick="resetOrders()" class="text-[10px] font-bold text-blue-600 underline uppercase">Resetear Posiciones</button>
            </div>
            <div id="gridD" class="grid grid-cols-5 gap-3"></div>
        </div>

        <div class="bg-slate-900 rounded-[2rem] overflow-hidden shadow-2xl mb-10 border-4 border-slate-800">
            <div class="grid grid-cols-3 p-4 bg-black text-[10px] font-black text-slate-500 uppercase text-center italic">
                <div>Función</div><div>Borne Viejo</div><div>Borne Nuevo</div>
            </div>
            <div id="summaryTable" class="divide-y divide-slate-800"></div>
        </div>

        <section class="bg-white rounded-[2.5rem] p-8 shadow-2xl border-4 border-blue-600 text-center">
            <h3 id="stepTitle" class="text-blue-700 font-black text-base uppercase mb-4 tracking-tighter underline decoration-4 underline-offset-8">Protocolo de Rescate Técnico</h3>
            <div id="stepDesc" class="text-slate-600 text-sm font-semibold italic">Utilice este asistente si desconoce la correspondencia de los hilos existentes en la instalación.</div>
            
            <div id="wizardButtons" class="flex gap-6 mt-10">
                <button onclick="startWizard()" class="btn-start-pro">Iniciar Identificación de Hilos</button>
            </div>
        </section>
    </div>

    <script>
        const DB = {
            "aiphone": { n: "Aiphone VC-K", b: { a: "4", m: "2", g: "3", s: "1", l: "B" } },
            "alcad": { n: "Alcad 901/901C", b: { a: "1", m: "3", g: "4", s: "2", l: "2" } },
            "amplyvox": { n: "Amplyvox Elite", b: { a: "6", m: "1", g: "0", s: "2", l: "E" } },
            "auta": { n: "Auta TF-92", b: { a: "10", m: "3", g: "4", s: "12", l: "7" } },
            "bitron": { n: "Bitron AN0002", b: { a: "9", m: "2", g: "6", s: "1", l: "C7" } },
            "bpt": { n: "BPT (Masa 4)", b: { a: "2", m: "1", g: "4", s: "3", l: "5" } },
            "comelit": { n: "Comelit OK", b: { a: "P1", m: "2", g: "3", s: "4", l: "S" } },
            "elvox": { n: "Elvox 8870", b: { a: "7", m: "2", g: "3", s: "1", l: "6" } },
            "farfisa": { n: "Farfisa 724", b: { a: "5", m: "2", g: "3", s: "1", l: "6" } },
            "fermax": { n: "Fermax Universal", b: { a: "1", m: "2", g: "3", s: "6", l: "4" } },
            "giacomo": { n: "Giacomo Masa 3", b: { a: "P", m: "1", g: "3", s: "2", l: "4" } },
            "golmar_ant": { n: "Golmar Antiguo", b: { a: "X", m: "M", g: "C", s: "A", l: "L" } },
            "golmar_t510": { n: "Golmar T-510R", b: { a: "P1", m: "5", g: "3", s: "10", l: "7" } },
            "siedle": { n: "Siedle HT-611", b: { a: "I", m: "12", g: "9", s: "11", l: "7" } },
            "tegui_7": { n: "Tegui Serie 7", b: { a: "3", m: "4", g: "2", s: "5", l: "1" } },
            "televes": { n: "Televes 4+N", b: { a: "T", m: "2", g: "3", s: "1", l: "6" } },
            "urmet": { n: "Urmet 1131", b: { a: "9", m: "2", g: "6", s: "1", l: "7" } },
            "videx": { n: "Videx 4+N", b: { a: "5", m: "2", g: "3", s: "1", l: "6" } }
        };

        const FUNCTIONS = { g: "Masa", a: "Abrep.", s: "Altav.", m: "Micro", l: "Llam." };
        const COLORS = { "Blanco":"#fff","Negro":"#1e293b","Azul":"#3b82f6","Rojo":"#ef4444","Verde":"#22c55e","Amarillo":"#facc15","Marrón":"#78350f","Gris":"#64748b","Naranja":"#f97316" };

        let orderO = ["g", "a", "s", "m", "l"];
        let orderD = ["g", "a", "s", "m", "l"];
        let userColors = { g:"", a:"", s:"", m:"", l:"" };

        function init() {
            const sO = document.getElementById('selectO');
            const sD = document.getElementById('selectD');
            Object.keys(DB).sort().forEach(k => {
                sO.add(new Option(DB[k].n, k));
                sD.add(new Option(DB[k].n, k));
            });
            sD.value = "fermax";
            updateUI();
        }

        function updateUI() {
            renderRegleta("O");
            renderRegleta("D");
            renderSummary();
        }

        function renderRegleta(type) {
            const grid = document.getElementById('grid' + type);
            const order = (type === "O") ? orderO : orderD;
            const model = DB[document.getElementById('select' + (type === "O" ? 'O' : 'D')).value];

            grid.innerHTML = order.map((key, index) => {
                const colorHex = COLORS[userColors[key]] || "";
                const textColor = (colorHex==="#1e293b"||colorHex==="#78350f"||colorHex==="#3b82f6") ? "text-white" : "text-slate-900";
                
                return `
                <div class="borne-card">
                    <select onchange="reorder('${type}', ${index}, this.value)">
                        ${[0,1,2,3,4].map(i => `<option value="${order[i]}" ${i===index?'selected':''}>Pos ${i+1}</option>`).join('')}
                    </select>
                    <div class="pill ${textColor}" style="background-color: ${colorHex || '#fff'}; border-color: ${colorHex || '#cbd5e1'}">
                        ${model.b[key]}
                    </div>
                    <span class="label-func">${FUNCTIONS[key]}</span>
                    ${type === "O" ? `
                        <select onchange="userColors['${key}']=this.value; updateUI()" class="text-[8px] font-black border-slate-200">
                            <option value="">COLOR...</option>
                            ${Object.keys(COLORS).map(c => `<option value="${c}" ${userColors[key]===c?'selected':''}>${c}</option>`).join('')}
                        </select>
                    ` : `
                        <div class="text-[9px] font-black text-blue-700 bg-white border border-slate-100 px-2 rounded-md">${userColors[key] || '---'}</div>
                    `}
                </div>
            `}).join('');
        }

        function reorder(type, index, newKey) {
            let arr = (type === "O") ? orderO : orderD;
            const oldKeyAtPos = arr[index];
            const oldIndexForNewKey = arr.indexOf(newKey);
            arr[oldIndexForNewKey] = oldKeyAtPos;
            arr[index] = newKey;
            updateUI();
        }

        function renderSummary() {
            const mO = DB[document.getElementById('selectO').value];
            const mD = DB[document.getElementById('selectD').value];
            document.getElementById('summaryTable').innerHTML = ["g", "a", "s", "m", "l"].map(key => `
                <div class="grid grid-cols-3 p-4 items-center text-center font-bold">
                    <div class="uppercase text-[9px] text-slate-500 italic">${FUNCTIONS[key]}</div>
                    <div class="text-white text-xl">${mO.b[key]} <span class="text-[9px] text-slate-600 font-normal">[${userColors[key] || '?'}]</span></div>
                    <div class="text-emerald-400 text-xl font-black">${mD.b[key]}</div>
                </div>
            `).join('');
        }

        function resetOrders() {
            orderO = ["g", "a", "s", "m", "l"];
            orderD = ["g", "a", "s", "m", "l"];
            updateUI();
        }

        // PROTOCOLO TÉCNICO AVANZADO
        let step = 0;
        const STEPS = [
            { t: "1. LOCALIZAR EL RETORNO (COMÚN)", d: `<div class="instruccion-box"><b>PROCEDIMIENTO:</b> Realice puentes aleatorios entre parejas de hilos. El objetivo es activar el relé de apertura de la placa externa.<br><br>De los dos hilos que activen la cerradura, uno es la <b>MASA (G)</b> y el otro el <b>ABREPUERTAS (A)</b>.</div>`, y: 2, n: 1 },
            { t: "BUSQUEDA DE CONTINUIDAD", d: `<div class="instruccion-box">¿Ha logrado activar la cerradura eléctrica?<br><br>Si no es así, mantenga un hilo como pivote y recorra el resto hasta cerrar el circuito.</div>`, y: 2, n: 1 },
            { t: "2. VERIFICACIÓN DE CANAL RX (AUDIO)", d: `<div class="instruccion-box">Conecte los hilos identificados en sus bornes (G y A). Seleccione un tercer hilo y verifique la impedancia en el borne de <b>ALTAVOZ (S)</b>.<br><br>¿Percibe ruido ambiental o comunicación desde la calle?</div>`, y: 4, n: 3 },
            { t: "3. AJUSTE DE IMPEDANCIA / POLARIDAD", d: `<div class="instruccion-box">Si el audio es débil o presenta zumbido de alterna, existe una <b>INVERSIÓN DE POLARIDAD</b>.<br><br><b>ACCIÓN:</b> Intercambie los hilos de Masa y Abrepuertas en el esquema de Origen. ¿Mejoró la ganancia de audio?</div>`, y: 4, n: 2 },
            { t: "¡SISTEMA IDENTIFICADO!", d: `<div class="instruccion-box">El hilo restante con señal de modulación es el <b>MICRÓFONO</b>. El hilo sin tensión en reposo es la <b>LLAMADA</b>.<br><br>Consulte la tabla de equivalencia inferior para el conexionado final.</div>`, final: true }
        ];

        function startWizard() { step = 0; showStep(); }
        function move(ans) { step = (ans==='yes') ? STEPS[step].y : STEPS[step].n; showStep(); }
        function showStep() {
            const s = STEPS[step];
            document.getElementById('stepTitle').innerText = s.t;
            document.getElementById('stepDesc').innerHTML = s.d;
            document.getElementById('wizardButtons').innerHTML = s.final ? 
                `<button onclick="location.reload()" class="w-full bg-emerald-500 text-white font-black py-6 rounded-2xl shadow-lg border-4 border-emerald-700 uppercase text-xl">GUARDAR Y FINALIZAR</button>` :
                `<button onclick="move('no')" class="btn-no-pro">NEGATIVO</button>
                 <button onclick="move('yes')" class="btn-yes-pro">AFIRMATIVO</button>`;
        }

        init();
    </script>
</body>
</html>
